# 🐍 GitHub Contribution Snake Animation
# This workflow generates the snake animation SVG from your contribution graph.
#
# HOW TO SET UP:
# 1. Create repo: YOUR_USERNAME/YOUR_USERNAME (if not already)
# 2. Put this file at: .github/workflows/snake.yml
# 3. Go to repo Settings → Actions → General → Workflow permissions → "Read and write permissions" ✅
# 4. Run the workflow manually once (Actions tab → "Generate Snake" → "Run workflow")
# 5. Done! It will auto-run daily after that.

name: Generate Snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:       # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Game from GitHub Contribution Grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
